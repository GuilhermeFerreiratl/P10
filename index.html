<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel 10 - Orçamento</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <img src="logo-p10.png" alt="Painel 10" class="logo">
    <p class="subtitulo">Energia Solar Inteligente</p>
    
    <div class="card">
      <label>Consumo Mensal kWh</label>
      <input id="kwh" type="number" placeholder="Ex: 1000">
      
      <label>Tipo de Sistema</label>
      <select id="tipo">
        <option value="micro">Micro Inversor Hoymiles</option>
        <option value="string">Inversor String Growatt</option>
      </select>

      <button onclick="gerarOrcamento()">Gerar Orçamento</button>
    </div>

    <div id="resultado" class="hidden"></div>
    <button id="btnPdf" onclick="gerarPDF()" class="hidden">Baixar PDF</button>
  </div>
  <script src="script.js"></script>
  <script>
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
  </script>
</body>
</html>
