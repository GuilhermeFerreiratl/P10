<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orçamento Solar Áureo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="logo">
    <h1>☀️ Painel 10</h1>
    <p>Gerador de Orçamento Fotovoltaico</p>
  </div>

  <div class="form-group">
    <label>Nome do Cliente:</label>
    <input id="cliente" type="text" placeholder="Ex: João Silva">
  </div>

  <div class="form-group">
    <label>Consumo Mensal kWh:</label>
    <input id="kwh" type="number" placeholder="Ex: 350">
  </div>

  <div class="form-group">
    <label>Tipo de Inversor:</label>
    <select id="tipo">
      <option value="string">String - Growatt 6KW</option>
      <option value="micro">Micro - Hoymiles</option>
    </select>
  </div>
  
  <button class="btn" onclick="gerarOrcamento()">Gerar 2 Relatórios</button>
  <button class="btn btn-print" onclick="window.print()">Imprimir / Salvar PDF</button>

  <div id="resultado"></div>
</div>

<script src="script.js"></script>
</body>
</html>
